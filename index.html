<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Aries · 踏天境</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ===== 基础重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(145deg, #d6eaf8, #a9d0e6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            transition: background 0.3s;
        }
        
        /* ===== 卡片容器 ===== */
        .glass-card {
            max-width: 880px;
            width: 100%;
            background: rgba(235, 247, 255, 0.65);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 48px;
            padding: 32px 32px 40px;
            box-shadow: 0 30px 60px -20px rgba(8, 60, 100, 0.4), 0 8px 20px rgba(0, 40, 70, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
        }
        
        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        
        .title-group {
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
        }
        
        .title-group h1 {
            font-size: 2.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0b4463, #1d6c97);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .badge {
            background: rgba(21, 94, 136, 0.18);
            backdrop-filter: blur(4px);
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #0f4d70;
            border: 1px solid rgba(255, 255, 255, 0.5);
            letter-spacing: 0.4px;
        }
        
        .sub-desc {
            color: #135172;
            font-size: 0.9rem;
            border-left: 4px solid #3287b5;
            padding-left: 18px;
            background: rgba(50, 135, 181, 0.06);
            border-radius: 0 16px 16px 0;
            line-height: 1.5;
            margin-bottom: 28px;
            padding: 8px 16px 8px 22px;
        }
        
        /* ===== 输入区域 ===== */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 24px;
        }
        
        .input-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        
        .input-row label {
            font-weight: 500;
            color: #0c4868;
            min-width: 80px;
            font-size: 0.9rem;
            letter-spacing: 0.2px;
        }
        
        .input-row input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border: 1px solid rgba(60, 145, 195, 0.35);
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            font-size: 0.95rem;
            transition: 0.2s;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            color: #053a55;
            font-weight: 450;
        }
        
        .input-row input:focus {
            outline: none;
            border-color: #2a82b0;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 5px rgba(42, 130, 176, 0.2);
        }
        
        .input-row input::placeholder {
            color: #6f9ebd;
            font-weight: 300;
        }
        
        .input-row input:invalid {
            border-color: #e74c3c;
        }
        
        /* ===== 高级选项 ===== */
        .advanced-area {
            background: rgba(200, 229, 245, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        .adv-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
        }
        
        .adv-row label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #0a4d70;
            min-width: 70px;
        }
        
        .adv-row select {
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #b2d3ea;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            color: #043a55;
            transition: 0.15s;
            cursor: pointer;
            flex: 1;
            min-width: 150px;
        }
        
        .adv-row select:focus {
            outline: none;
            border-color: #2a82b0;
            box-shadow: 0 0 0 3px rgba(42, 130, 176, 0.25);
        }
        
        .inline-hint {
            font-size: 0.7rem;
            color: #347a9e;
            margin-left: 4px;
        }
        
        /* ===== 按钮区域 ===== */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 22px 0 18px;
            align-items: center;
            justify-content: space-between;
        }
        
        .btn {
            border: none;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #0b4b6b;
            border: 1px solid rgba(110, 175, 210, 0.5);
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            user-select: none;
        }
        
        .btn-primary {
            background: #1d6f9c;
            border: 1px solid #13547a;
            color: white;
            box-shadow: 0 8px 18px rgba(24, 86, 128, 0.3);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #135a82;
            transform: scale(0.97);
            box-shadow: 0 6px 14px rgba(20, 80, 120, 0.35);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid #8bbddb;
        }
        
        .btn-outline:hover:not(:disabled) {
            background: rgba(42, 130, 176, 0.08);
            border-color: #4f9bc2;
        }
        
        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }
        
        /* ===== 结果面板 ===== */
        .result-panel {
            margin-top: 28px;
            background: #0b293f;
            border-radius: 32px;
            padding: 20px 22px 18px;
            border: 1px solid #3d7d9f;
            box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.5);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        
        .result-header span {
            color: #b2ddf5;
            font-weight: 450;
            font-size: 0.85rem;
            background: #1d4057;
            padding: 4px 18px;
            border-radius: 40px;
            letter-spacing: 0.2px;
        }
        
        .copy-btn {
            background: #1e5a7a;
            border: none;
            color: #e3f2fc;
            padding: 6px 22px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #4787aa;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .copy-btn:hover:not(:disabled) {
            background: #2b7197;
            color: white;
            border-color: #6aa6c9;
        }
        
        .copy-btn.copied {
            background: #1d7a5a;
            border-color: #2b9e7a;
            color: white;
        }
        
        .copy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* ===== 日志区域 ===== */
        .log-box {
            background: #0d2a3e;
            border-radius: 20px;
            padding: 18px 18px 12px;
            color: #c4e2f3;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.78rem;
            line-height: 1.9;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid #3a789b;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        .log-box:empty::before {
            content: "🔮 等待转换…… 点击「转换订阅」生成链接";
            color: #5896bb;
            font-style: italic;
            font-weight: 300;
        }
        
        .log-box a {
            color: #95d0ef;
            text-decoration: underline;
            word-break: break-all;
        }
        
        .log-box a:hover {
            color: #c2edff;
        }
        
        .log-box .error {
            color: #f07a6a;
        }
        
        .log-box .success {
            color: #4cdb8c;
        }
        
        .log-box .warning {
            color: #f7b773;
        }
        
        .log-box .info {
            color: #7fc9f0;
        }
        
        .log-box .link-container {
            margin-top: 6px;
        }
        
        .log-box .plain-text {
            margin-top: 8px;
            opacity: 0.6;
            font-size: 0.7rem;
        }
        
        /* ===== 滚动条 ===== */
        .log-box::-webkit-scrollbar {
            width: 5px;
            background: #1a4057;
            border-radius: 10px;
        }
        
        .log-box::-webkit-scrollbar-thumb {
            background: #3f84aa;
            border-radius: 10px;
        }
        
        .log-box::-webkit-scrollbar-thumb:hover {
            background: #5ca3c9;
        }
        
        /* ===== 底部 ===== */
        .footer-note {
            margin-top: 14px;
            font-size: 0.7rem;
            color: #3d789b;
            text-align: right;
            border-top: 1px dashed #8ebdd7;
            padding-top: 14px;
            letter-spacing: 0.2px;
        }
        
        /* ===== 状态指示器 ===== */
        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        
        .status-badge.online {
            background: #4cdb8c;
            box-shadow: 0 0 8px #4cdb8c;
        }
        
        .status-badge.offline {
            background: #f07a6a;
            box-shadow: 0 0 8px #f07a6a;
        }
        
        .status-badge.checking {
            background: #f7b773;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        
        /* ===== 辅助类 ===== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        
        /* ===== 响应式 ===== */
        @media (max-width: 580px) {
            .glass-card {
                padding: 24px 16px;
            }
        
            .title-group h1 {
                font-size: 1.6rem;
            }
        
            .input-row {
                flex-direction: column;
                align-items: stretch;
            }
        
            .input-row label {
                min-width: auto;
            }
        
            .adv-row {
                flex-direction: column;
                align-items: stretch;
            }
        
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
        
            .btn {
                justify-content: center;
            }
        
            .result-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <div class="glass-card">
        <div class="header">
            <div class="title-group">
                <h1>⚡ 订阅转换</h1>
                <span class="badge">Aries · 踏天境</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;font-size:0.7rem;color:#0f4d70;">
                <span class="status-badge checking" id="statusBadge"></span>
                <span id="statusText">检测中...</span>
            </div>
        </div>
        <div class="sub-desc">🌊 蓝色基调 · 一键转换订阅 · 自动复制</div>

        <div class="input-section">
            <div class="input-row">
                <label for="subUrl">📎 订阅URL</label>
                <input type="url" id="subUrl" inputmode="url" autocomplete="url" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="2000" placeholder="https://example.com/sub/xxx" value="">
            </div>
            <div class="advanced-area">
                <div class="adv-row">
                    <label for="targetSelect">🎯 目标</label>
                    <select id="targetSelect">
                        <option value="clash">Clash</option>
                        <option value="clashr">ClashR</option>
                        <option value="clashmeta">Clash Meta</option>
                        <option value="surge">Surge</option>
                        <option value="quantumultx">Quantumult X</option>
                        <option value="loon">Loon</option>
                        <option value="shadowrocket">Shadowrocket</option>
                    </select>
                </div>
                <div class="adv-row">
                    <label for="configSelect">📜 规则集</label>
                    <select id="configSelect">
                        <!-- 选项由 JavaScript 动态生成 -->
                    </select>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-primary" id="convertBtn">🔄 转换订阅</button>
            <button class="btn btn-outline" id="clearAllBtn" style="border-color:#7bb5d6;">🧹 重置全部</button>
        </div>

        <div class="result-panel">
            <div class="result-header">
                <span>📋 转换日志 / 链接</span>
                <button class="copy-btn" id="copyBtn" disabled>📄 复制链接</button>
            </div>
            <div class="log-box" id="logOutput" role="log" aria-live="polite"></div>
        </div>
        <div class="footer-note">🌐 点击转换生成链接 · 支持 Clash / Surge / Quantumult X</div>
    </div>

    <script>

            "use strict";
        
            // ===== 配置 =====
            const CONFIG = {

                CONFIG_OPTIONS: [

                    { name: 'ACL4SSR_Online_NoAuto', url: 'https://raw.githubusercontent.com/WC-Dream/ACL4SSR/refs/heads/WD/Clash/config/ACL4SSR_Online_NoAuto.ini' },
                    { name: 'ACL4SSR_Online_NoReject', url: 'https://raw.githubusercontent.com/WC-Dream/ACL4SSR/refs/heads/WD/Clash/config/ACL4SSR_Online_NoReject.ini' },
                    { name: 'ACL4SSR_WithChinaIp', url: 'https://raw.githubusercontent.com/WC-Dream/ACL4SSR/refs/heads/WD/Clash/config/ACL4SSR_WithChinaIp.ini' },
                    { name: 'ACL4SSR_WithChinaIp_WithGFW', url: 'https://raw.githubusercontent.com/WC-Dream/ACL4SSR/refs/heads/WD/Clash/config/ACL4SSR_WithChinaIp_WithGFW.ini' },
                    { name: 'ACL4SSR_WithGFW', url: 'https://raw.githubusercontent.com/WC-Dream/ACL4SSR/refs/heads/WD/Clash/config/ACL4SSR_WithGFW.ini' },
                ],
                FIXED_PARAMS: {
                    insert: 'false',
                    emoji: 'true',
                    list: 'false',
                    xudp: 'true',
                    udp: 'true',
                    tfo: 'true',
                    expand: 'true',
                    scv: 'false',
                    fdn: 'false',
                    'clash.doh': 'true',
                    new_name: 'true',
                    diyua: 'ShadowRocket'
                },
                STORAGE_KEY: 'aries_last_sub_url',
                MAX_RETRY: 2,
                TIMEOUT: 10000,
            };
        
            // ===== DOM 引用 =====
            const subUrlInput = document.getElementById('subUrl');
            const convertBtn = document.getElementById('convertBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const logOutput = document.getElementById('logOutput');
            const copyBtn = document.getElementById('copyBtn');
            const targetSelect = document.getElementById('targetSelect');
            const configSelect = document.getElementById('configSelect');
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
        
            // ===== 状态 =====
            let isConverting = false;
            let lastConvertedLink = null;
            let statusCheckTimer = null;
            let ariaLiveElement = null;
        
            // ===== 工具函数 =====
            function debounce(fn, delay = 300) {
                let timer = null;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            }
        
            function formatTime() {
                return new Date().toLocaleTimeString('zh-CN', { hour12: false });
            }
        
            function getAriaLiveElement() {
                if (!ariaLiveElement || !document.body.contains(ariaLiveElement)) {
                    ariaLiveElement = document.createElement('div');
                    ariaLiveElement.setAttribute('role', 'status');
                    ariaLiveElement.setAttribute('aria-live', 'polite');
                    ariaLiveElement.className = 'sr-only';
                    document.body.appendChild(ariaLiveElement);
                }
                return ariaLiveElement;
            }
        
            function announce(message) {
                const el = getAriaLiveElement();
                el.textContent = message;
                setTimeout(() => { el.textContent = ''; }, 3000);
            }
        
            // ===== 日志系统 =====
            function appendToLog(content, className = '') {
                const wrapper = document.createElement('div');
                if (className) wrapper.className = className;
        
                if (typeof content === 'string') {
                    const urlMatch = content.match(/(https?:\/\/[^\s]+)/);
                    if (urlMatch && className !== 'error' && className !== 'warning') {
                        const parts = content.split(/(https?:\/\/[^\s]+)/);
                        parts.forEach((part) => {
                            if (part.match(/^https?:\/\/[^\s]+$/)) {
                                const a = document.createElement('a');
                                a.href = part;
                                a.target = '_blank';
                                a.rel = 'noopener noreferrer';
                                a.textContent = part;
                                wrapper.appendChild(a);
                            } else if (part) {
                                wrapper.appendChild(document.createTextNode(part));
                            }
                        });
                    } else {
                        wrapper.textContent = content;
                    }
                } else if (content instanceof Node) {
                    wrapper.appendChild(content);
                }
        
                logOutput.appendChild(wrapper);
                logOutput.scrollTop = logOutput.scrollHeight;
            }
        
            function clearLog() {
                logOutput.innerHTML = '';
                logOutput.removeAttribute('data-link');
                lastConvertedLink = null;
                copyBtn.disabled = true;
                copyBtn.textContent = '📄 复制链接';
                copyBtn.classList.remove('copied');
            }
        
            function logInfo(message) {
                appendToLog(`ℹ️ ${message}`, 'info');
            }
        
            function logSuccess(message) {
                appendToLog(`✅ ${message}`, 'success');
                announce('转换成功');
            }
        
            function logWarning(message) {
                appendToLog(`⚠️ ${message}`, 'warning');
            }
        
            function logError(message) {
                appendToLog(`❌ ${message}`, 'error');
                announce('转换失败');
            }
        
            // ===== API 状态检测 =====
            async function checkApiStatus() {
                try {
                    statusBadge.className = 'status-badge checking';
                    statusText.textContent = '检测中...';
        
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
        
                    const response = await fetch(CONFIG.BASE_API, {
                        method: 'HEAD',
                        signal: controller.signal,
                        mode: 'cors',
                    });
        
                    clearTimeout(timeoutId);
        
                    if (response.ok) {
                        statusBadge.className = 'status-badge online';
                        statusText.textContent = 'API 在线';
                    } else {
                        statusBadge.className = 'status-badge offline';
                        statusText.textContent = `API 异常 (${response.status})`;
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        statusBadge.className = 'status-badge offline';
                        statusText.textContent = 'API 超时';
                    } else {
                        statusBadge.className = 'status-badge offline';
                        statusText.textContent = 'API 不可达';
                    }
                    console.warn('API 状态检测失败:', error.message);
                }
            }
        
            // ===== 构建转换链接 =====
            function buildConvertUrl(userSubUrl, target, configUrl) {
                const trimmed = userSubUrl.trim();
                if (!trimmed) return null;
        
                try {
                    new URL(trimmed);
                } catch {
                    return null;
                }
        
                const params = new URLSearchParams();
                params.set('target', target);
                params.set('config', configUrl);
        
                for (const [key, value] of Object.entries(CONFIG.FIXED_PARAMS)) {
                    params.set(key, value);
                }
                params.set('url', trimmed);
        
                return `${CONFIG.BASE_API}?${params.toString()}`;
            }
        
            // ===== 验证订阅链接 =====
            async function validateSubscription(url) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), CONFIG.TIMEOUT);
        
                    const response = await fetch(url, {
                        method: 'HEAD',
                        signal: controller.signal,
                        mode: 'cors',
                    });
        
                    clearTimeout(timeoutId);
        
                    if (response.ok) {
                        return { valid: true, status: response.status };
                    } else {
                        return { valid: false, status: response.status, error: `HTTP ${response.status}` };
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        return { valid: false, error: '连接超时' };
                    }
                    return { valid: false, error: error.message || '网络错误' };
                }
            }
        
            // ===== 显示转换结果 =====
            function displayConvertedLink(link, target, rawUrl, configName) {
                clearLog();
                if (!link) {
                    logError('生成的转换链接无效，请检查订阅地址。');
                    return;
                }
        
                lastConvertedLink = link;
                logOutput.dataset.link = link;
                copyBtn.disabled = false;
        
                logSuccess('转换成功！');
                logInfo(`目标: ${target} | 规则集: ${configName || '已选'} | 时间: ${formatTime()}`);
        
                const linkContainer = document.createElement('div');
                linkContainer.className = 'link-container';
                const label = document.createTextNode('🔗 转换链接: ');
                linkContainer.appendChild(label);
                const a = document.createElement('a');
                a.href = link;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.textContent = link;
                linkContainer.appendChild(a);
                logOutput.appendChild(linkContainer);
        
                const plainContainer = document.createElement('div');
                plainContainer.className = 'plain-text';
                const plainLabel = document.createTextNode('📎 纯文本: ');
                plainContainer.appendChild(plainLabel);
                plainContainer.appendChild(document.createTextNode(link));
                logOutput.appendChild(plainContainer);
        
                logOutput.scrollTop = logOutput.scrollHeight;
        
                try {
                    localStorage.setItem(CONFIG.STORAGE_KEY, rawUrl);
                } catch (e) { /* ignore */ }
            }
        
            // ===== 主要转换逻辑 =====
            async function handleConvert() {
                if (isConverting) return;
        
                const rawUrl = subUrlInput.value.trim();
                const target = targetSelect.value;
                const configOption = configSelect.options[configSelect.selectedIndex];
                const configUrl = configOption ? configOption.value : CONFIG.CONFIG_OPTIONS[0].url;
                const configName = configOption ? configOption.text : CONFIG.CONFIG_OPTIONS[0].name;
        
                if (!rawUrl) {
                    clearLog();
                    logError('请先输入订阅 URL。');
                    subUrlInput.focus();
                    return;
                }
        
                try {
                    new URL(rawUrl);
                } catch {
                    clearLog();
                    logWarning('订阅链接格式无效，请输入有效的 HTTP/HTTPS 地址。');
                    subUrlInput.focus();
                    subUrlInput.setCustomValidity('请输入有效的 URL');
                    subUrlInput.reportValidity();
                    return;
                }
                subUrlInput.setCustomValidity('');
        
                isConverting = true;
                convertBtn.disabled = true;
                convertBtn.textContent = '⏳ 转换中...';
                clearLog();
                logInfo('正在生成转换链接...');
                logInfo(`使用规则集: ${configName}`);
        
                try {
                    logInfo('正在验证订阅链接...');
                    const validation = await validateSubscription(rawUrl);
                    if (!validation.valid) {
                        logWarning(`订阅链接验证失败: ${validation.error || '未知错误'}`);
                        logInfo('将尝试生成转换链接（可能无效）...');
                    } else {
                        logInfo(`订阅链接验证通过 (HTTP ${validation.status})`);
                    }
        
                    const converted = buildConvertUrl(rawUrl, target, configUrl);
                    if (!converted) {
                        logError('生成转换链接失败，请检查订阅地址。');
                        return;
                    }
        
                    displayConvertedLink(converted, target, rawUrl, configName);
        
                } catch (error) {
                    logError(`转换过程发生错误: ${error.message}`);
                    console.error('转换错误:', error);
                } finally {
                    isConverting = false;
                    convertBtn.disabled = false;
                    convertBtn.textContent = '🔄 转换订阅';
                }
            }
        
            // ===== 复制功能 =====
            function copyConvertedLink() {
                const link = lastConvertedLink || logOutput.dataset.link;
                if (!link) {
                    logWarning('没有可复制的链接，请先执行转换。');
                    announce('没有可复制的链接');
                    return;
                }
        
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(link)
                        .then(() => showCopySuccess())
                        .catch(() => fallbackCopy(link));
                } else {
                    fallbackCopy(link);
                }
            }
        
            function showCopySuccess() {
                copyBtn.textContent = '✅ 已复制';
                copyBtn.classList.add('copied');
                announce('链接已复制到剪贴板');
        
                setTimeout(() => {
                    copyBtn.textContent = '📄 复制链接';
                    copyBtn.classList.remove('copied');
                }, 3000);
            }
        
            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
        
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        showCopySuccess();
                    } else {
                        logWarning('复制失败，请手动复制链接。');
                        announce('复制失败');
                    }
                } catch {
                    logWarning('复制失败，请手动复制链接。');
                    announce('复制失败');
                } finally {
                    document.body.removeChild(textarea);
                }
            }
        
            // ===== 重置功能 =====
            function clearAll() {
                subUrlInput.value = '';
                clearLog();
                subUrlInput.focus();
                subUrlInput.setCustomValidity('');
                subUrlInput.blur();
                try {
                    localStorage.removeItem(CONFIG.STORAGE_KEY);
                } catch (e) { /* ignore */ }
                logInfo('已重置所有内容');
                announce('已重置');
            }
        
            // ===== 恢复上次使用的 URL =====
            function restoreLastUrl() {
                try {
                    const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (saved) {
                        subUrlInput.value = saved;
                        logInfo(`已恢复上次使用的订阅链接`);
                    }
                } catch (e) { /* ignore */ }
            }
        
            // ===== 初始化配置下拉菜单 =====
            function populateConfigOptions() {
                if (!configSelect) return;
                configSelect.innerHTML = '';
                CONFIG.CONFIG_OPTIONS.forEach((option, index) => {
                    const optElement = document.createElement('option');
                    optElement.value = option.url;
                    optElement.textContent = option.name;
                    if (index === 0) {
                        optElement.selected = true;
                    }
                    configSelect.appendChild(optElement);
                });
            }
        
            // ===== 键盘快捷键 =====
            function handleKeyboard(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    convertBtn.click();
                }
                if (e.key === 'Escape' && document.activeElement === subUrlInput) {
                    subUrlInput.value = '';
                    subUrlInput.blur();
                }
            }
        
            // ===== 初始化 =====
            function init() {
                populateConfigOptions();
                restoreLastUrl();
        
                checkApiStatus();
                statusCheckTimer = setInterval(checkApiStatus, 60000);
        
                convertBtn.addEventListener('click', handleConvert);
                clearAllBtn.addEventListener('click', clearAll);
                copyBtn.addEventListener('click', copyConvertedLink);
        
                subUrlInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        convertBtn.click();
                    }
                });
        
                subUrlInput.addEventListener('input', () => {
                    subUrlInput.setCustomValidity('');
                });
        
                document.addEventListener('keydown', handleKeyboard);
        
                const saveToStorage = debounce((value) => {
                    try {
                        if (value) localStorage.setItem(CONFIG.STORAGE_KEY, value);
                    } catch (e) { /* ignore */ }
                }, 500);
                subUrlInput.addEventListener('input', (e) => {
                    saveToStorage(e.target.value.trim());
                });
        
                window.addEventListener('beforeunload', () => {
                    if (statusCheckTimer) {
                        clearInterval(statusCheckTimer);
                    }
                    if (ariaLiveElement && document.body.contains(ariaLiveElement)) {
                        document.body.removeChild(ariaLiveElement);
                    }
                });
        
                logInfo('✨ 欢迎使用订阅转换工具');
                logInfo('💡 支持快捷键: Ctrl+Enter 转换, Esc 清空输入');
                logInfo(`📜 已加载 ${CONFIG.CONFIG_OPTIONS.length} 个规则集`);
        
                console.log('🚀 Aries 订阅转换已初始化');
                console.log(`📌 API: ${CONFIG.BASE_API}`);
                console.log(`📌 规则集数量: ${CONFIG.CONFIG_OPTIONS.length}`);
            }
        
            // ===== 启动 =====
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        
        })();
    </script>
</body>
